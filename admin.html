<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="dashboard-body">
    <header class="topbar">
      <div class="container topbar-inner">
        <h2>Admin Dashboard</h2>
        <div class="topbar-actions">
          <span id="adminUserBadge"></span>
          <button id="logoutBtn" class="button secondary">Logout</button>
        </div>
      </div>
    </header>

    <main class="container dashboard-shell">
      <section class="panel filters-panel">
        <h3>Filters</h3>
        <div class="filter-grid">
          <div class="field">
            <label for="filterName">Name</label>
            <input id="filterName" type="text" placeholder="Search by name" />
          </div>
          <div class="field">
            <label for="filterClass">Class</label>
            <input id="filterClass" type="text" placeholder="Search by class" />
          </div>
          <div class="field">
            <label for="filterMinAge">Min Age</label>
            <input id="filterMinAge" type="number" min="0" placeholder="0" />
          </div>
          <div class="field">
            <label for="filterMaxAge">Max Age</label>
            <input id="filterMaxAge" type="number" min="0" placeholder="100" />
          </div>
        </div>
      </section>

      <section class="panel table-panel">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Class</th>
                <th>Age</th>
                <th>Qualification</th>
                <th>Aadhaar</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="studentTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <div id="editModal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Edit Student</h3>
          <button class="close-modal" type="button" aria-label="Close">&times;</button>
        </div>
        <form id="editStudentForm" class="stacked-form">
          <div class="field">
            <label for="editName">Name</label>
            <input id="editName" name="editName" type="text" required />
          </div>
          <div class="field">
            <label for="editEmail">Email</label>
            <input id="editEmail" name="editEmail" type="email" readonly />
          </div>
          <div class="field">
            <label for="editPassword">Password</label>
            <input id="editPassword" name="editPassword" type="text" />
          </div>
          <div class="grid two-col">
            <div class="field">
              <label for="editDob">Date of Birth</label>
              <input id="editDob" name="editDob" type="date" />
            </div>
            <div class="field">
              <label for="editClass">Class</label>
              <input id="editClass" name="editClass" type="text" />
            </div>
          </div>
          <div class="grid two-col">
            <div class="field">
              <label for="editQualification">Qualification</label>
              <select id="editQualification" name="editQualification">
                <option>10th</option>
                <option>12th</option>
                <option>Diploma</option>
                <option>Bachelor's Degree</option>
                <option>Master's Degree</option>
              </select>
            </div>
            <div class="field">
              <label for="editMarks">Marks</label>
              <input id="editMarks" name="editMarks" type="number" min="0" max="100" />
            </div>
          </div>
          <div class="field">
            <label for="editAadhaar">Replace Aadhaar PDF</label>
            <input id="editAadhaar" name="editAadhaar" type="file" accept="application/pdf" />
          </div>
          <div id="editError" class="error-box" aria-live="polite"></div>
          <div class="modal-actions">
            <button type="submit" class="button primary">Save Changes</button>
            <button type="button" class="button secondary close-modal">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>

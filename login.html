<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - BusinessLabs</title>
    <!-- Explicit relative path to ensure CSS loads across environments -->
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="auth-body">
    <div class="container auth-shell">
      <div class="card form-card narrow">
        <div class="card-header center">
          <h1>Login</h1>
          <p>Admin and student access</p>
        </div>

        <form id="loginForm" class="stacked-form" autocomplete="on">
          <div class="field">
            <label for="loginEmail">Email</label>
            <input 
              id="loginEmail" 
              name="loginEmail" 
              type="email" 
              placeholder="e.g. student@example.com" 
              autocomplete="email"
              required 
            />
          </div>

          <div class="field">
            <label for="loginPassword">Password</label>
            <input 
              id="loginPassword" 
              name="loginPassword" 
              type="password" 
              placeholder="Enter your password"
              autocomplete="current-password"
              required 
            />
          </div>

          <div id="loginError" class="error-box" aria-live="polite"></div>

          <button type="submit" class="button primary">Login</button>
        </form>

        <div class="text-actions">
          <button id="forgotPasswordBtn" type="button" class="link-button">Forgot Password?</button>
        </div>

        <div class="switch-link">
          New here? <a href="./index.html">Create account</a>
        </div>
      </div>
    </div>

    <!-- Explicit relative path for JS execution -->
    <script src="./app.js"></script>
  </body>
</html>
